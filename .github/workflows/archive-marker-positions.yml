name: Archive current Gaileia markers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-marker-positions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout map repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read current shared coordinates
        run: node scripts/capture-shared-marker-positions.mjs
      - name: Commit timestamped marker backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker-position-backups/*-shared.json
          if git diff --cached --quiet; then
            echo "No new backup to commit"
          else
            git commit -m "Archive shared marker coordinates [skip ci]"
            git push
          fi
